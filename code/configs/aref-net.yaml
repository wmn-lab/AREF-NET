# AREF-Net: RGB MDCB + edge ESRB + BCAF at P4/P5.
nc: 4
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2], RGB]          # 0
  - [-1, 1, Conv, [128, 3, 2]]              # 1
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4: RGB P3
  - [-1, 1, Conv, [512, 3, 2]]              # 5
  - [-1, 2, MDCB, [512, True]]              # 6: RGB P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 7
  - [-1, 2, MDCB, [1024, True]]             # 8
  - [-1, 1, SPPF, [1024, 5]]               # 9
  - [-1, 2, C2PSA, [1024]]                 # 10: RGB P5
  - [-1, 1, Conv, [64, 3, 2], X]           # 11
  - [-1, 1, Conv, [128, 3, 2]]              # 12
  - [-1, 2, C3k2, [256, False, 0.25]]       # 13
  - [-1, 1, Conv, [256, 3, 2]]              # 14
  - [-1, 2, C3k2, [512, False, 0.25]]       # 15
  - [-1, 1, Conv, [512, 3, 2]]              # 16
  - [-1, 2, ESRB, [512, True]]              # 17: edge P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 18
  - [-1, 2, ESRB, [1024, True]]             # 19
  - [-1, 1, SPPF, [1024, 5]]               # 20
  - [-1, 2, C2PSA, [1024]]                 # 21: edge P5
  - [[6, 17], 1, BCAF, []]                 # 22
  - [-1, 2, C3k2, [512, True]]             # 23: fused P4
  - [[10, 21], 1, BCAF, []]                # 24
  - [-1, 2, C3k2, [1024, True]]            # 25: fused P5

head:
  - [25, 1, nn.Upsample, [None, 2, nearest]] # 26
  - [[-1, 23], 1, Concat, [1]]              # 27
  - [-1, 2, C3k2, [512, False]]             # 28
  - [-1, 1, nn.Upsample, [None, 2, nearest]] # 29
  - [[-1, 4], 1, Concat, [1]]               # 30
  - [-1, 2, C3k2, [256, False]]             # 31: P3
  - [-1, 1, Conv, [256, 3, 2]]              # 32
  - [[-1, 28], 1, Concat, [1]]              # 33
  - [-1, 2, C3k2, [512, False]]             # 34: P4
  - [-1, 1, Conv, [512, 3, 2]]              # 35
  - [[-1, 25], 1, Concat, [1]]              # 36
  - [-1, 2, C3k2, [1024, True]]             # 37: P5
  - [[31, 34, 37], 1, Segment, [nc, 32, 256]]
